[workspace]
author = ["GecklesTheClown"]
channels = ["conda-forge", "bioconda"]
name = "atropos"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
snakemake = ">=9.27.0,<10"
snakefmt = ">=2.0.3,<3"
ruff = ">=0.16.9,<0.17"
pyright = ">=1.1.414,<2"

[tasks]
snake-lint = "snakemake -s workflow/Snakefile --lint"

snake-format = "snakefmt workflow/"
snake-format-check = "snakefmt --check workflow/"

python-lint = "ruff check ."
python-format = "ruff format ."
python-format-check = "ruff format --check ."

typecheck = "pyright"
test = "pytest"
dry-run = "snakemake -s workflow/Snakefile -n --cores 1"
